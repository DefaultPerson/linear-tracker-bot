  <path d="M22 528 l10 -10 a5 5 0 0 1 7 7 l-12 12 a3 3 0 0 1 -4 -4 l10 -10" stroke="#6d7883" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="50" y="542" class="m">Message</text>
