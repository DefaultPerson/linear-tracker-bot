<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
  <defs>
    <style>
      .t{fill:#fff;font-size:15px}
      .b{font-weight:700}
      .i{font-style:italic}
      .m{fill:#6d7883;font-size:12px}
      .l{fill:#64b5f6}
      .n{fill:#5eb5f7;font-weight:700;font-size:15px}
    </style>
  </defs>

  <!-- Chat background -->
