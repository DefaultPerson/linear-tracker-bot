  <text x="84" y="320" class="t">— <tspan class="i">alice</tspan></text>
  <text x="100" y="342" class="t">• <tspan class="l" text-decoration="underline">Add two-factor authentication</tspan></text>
  <text x="100" y="364" class="t">• <tspan class="l" text-decoration="underline">Refactor auth module</tspan></text>
  <text x="84" y="386" class="t">— <tspan class="i">bob</tspan></text>
  <text x="100" y="408" class="t">• <tspan class="l" text-decoration="underline">Design dashboard UI</tspan></text>

  <text x="84" y="442" class="l">#linear</text>
  <text x="712" y="494" text-anchor="end" class="m">08:00</text>

