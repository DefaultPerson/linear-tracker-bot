  <text x="68" y="26" class="t b">Linear Tracker</text>
  <rect x="175" y="15" rx="3" ry="3" width="26" height="15" fill="#3498db"/>
  <text x="188" y="26" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">bot</text>
  <text x="68" y="44" class="m">bot</text>
  <g fill="#6d7883">
    <circle cx="760" cy="22" r="2"/>
    <circle cx="760" cy="28" r="2"/>
    <circle cx="760" cy="34" r="2"/>
