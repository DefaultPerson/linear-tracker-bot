  <text x="84" y="202" class="t b">Done</text>
  <text x="84" y="224" class="t">✓ <tspan class="l" text-decoration="underline">Fix login bug</tspan></text>
  <text x="84" y="246" class="t">✓ <tspan class="l" text-decoration="underline">Implement password reset</tspan></text>
  <text x="84" y="268" class="t">✓ <tspan class="l" text-decoration="underline">Update documentation</tspan></text>

