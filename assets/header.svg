  <circle cx="716" cy="533" r="1.3" fill="#6d7883"/>
  <circle cx="724" cy="533" r="1.3" fill="#6d7883"/>
  <path d="M715 539 q5 4 10 0" stroke="#6d7883" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <rect x="762" y="524" width="8" height="14" rx="4" fill="none" stroke="#6d7883" stroke-width="1.6"/>
  <path d="M757 534 a9 9 0 0 0 18 0" stroke="#6d7883" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <line x1="766" y1="544" x2="766" y2="550" stroke="#6d7883" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="762" y1="550" x2="770" y2="550" stroke="#6d7883" stroke-width="1.6" stroke-linecap="round"/>
